new:
  article:
    start: |-
      ## Начни писать

      Начните писать свой текст здесь...
  cancel: Операция отменена
  created: Файл успешно создан!
  creating: Создаётся файл...
  done: Готово! Приятного письма!
  error: Произошла ошибка
  jotting:
    description: Краткие заметки, разрозненные мысли или ежедневные наблюдения
    name: Заметка
  note:
    description: Глубокие, тщательно продуманные длинные тексты
    name: Статья
  open:
    error: Не удалось открыть VS Code
    message: Открыть этот файл в VS Code?
  preface:
    description: Обновления жизни, объявления сайта или творческая философия
    name: Предисловие
    start: Начните писать свой текст здесь...
  preview: Вот содержимое, которое будет создано по пути {path} 
  step:
    confirm: Продолжить создание этого файла?
    description:
      name: Описание (необязательно)
      placeholder: Краткое описание содержимого...
    id:
      name: ID содержимого (имя файла)
      placeholder: Введите ID содержимого...
      validate: >-
        ID содержимого может содержать только буквы, цифры и дефисы, и не может
        начинаться или заканчиваться дефисом
    language: Выберите язык
    options:
      draft: Отметить как черновик
      name: Выбрать дополнительные опции
      sensitive: Отметить как чувствительный контент
      toc: Показать оглавление
      top: Закрепить содержимое
    overwrite: Файл {path} уже существует. Перезаписать?
    series:
      name: Название серии (необязательно)
      placeholder: Оставьте пустым, если не часть серии
    structure:
      flat: Один Markdown файл
      folder: Папка с индексным файлом (для изображений)
      name: Какую структуру файла вы хотите использовать?
    tags:
      name: Теги (через запятую, необязательно)
      placeholder: 'напр.: Руководство, Astro, Учебник'
    title:
      name: Заголовок статьи
      placeholder: Введите заголовок…
      validate: Заголовок не может быть пустым
    type: Выберите тип контента
  welcome: Создать новую публикацию
